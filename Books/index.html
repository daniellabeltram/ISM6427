<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <p class="eyebrow">What America is reading</p>
      <h1>Shelf</h1>
    </header>

    <section>
      <div class="section-head">
        <h2>Top 5 Books Right Now</h2>
        <p class="note">Trending this week</p>
      </div>
      <ol id="books" class="books"></ol>
    </section>

    <section>
      <div class="section-head">
        <h2>Top 3 Genres</h2>
      </div>
      <div id="genres" class="genres"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Top 10 Authors</h2>
      </div>
      <ol id="authors" class="authors"></ol>
    </section>

    <footer class="credit">Book data from <a href="https://openlibrary.org/developers/api" target="_blank" rel="noopener">Open Library</a></footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
