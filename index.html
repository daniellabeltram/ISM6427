<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="app">
    <form id="search" class="glass search" autocomplete="off">
      <input id="query" type="text" placeholder="Search for a city" aria-label="Search for a city" />
      <button type="submit" aria-label="Search">Search</button>
    </form>

    <section class="glass current">
      <h1 id="city">Boca Raton</h1>
      <div id="temp" class="temp">--°</div>
      <div id="condition" class="condition">Loading…</div>
      <div id="hilo" class="hilo"></div>
    </section>

    <section class="glass details">
      <div><span>Feels Like</span><strong id="feels">--</strong></div>
      <div><span>Humidity</span><strong id="humidity">--</strong></div>
      <div><span>Wind</span><strong id="wind">--</strong></div>
      <div><span>Precipitation</span><strong id="precip">--</strong></div>
    </section>

    <section class="glass">
      <h2>Hourly Forecast</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="glass">
      <h2>7-Day Forecast</h2>
      <ul id="daily" class="daily"></ul>
    </section>

    <p id="error" class="error" hidden></p>
    <footer>Data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
